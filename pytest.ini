[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = sample_data __pycache__
# Tests needing real Docker, a GPU or other external resources are opt-in:
#   pytest -m "docker or gpu or integration"
addopts = -ra -m "not docker and not gpu and not integration"
markers =
    docker: requires a running Docker daemon and the Piper image
    gpu: requires an NVIDIA GPU, torch and the TTS package
    integration: end-to-end test that uses external services or heavy resources
